{% extends "base.html" %}

{% block title %}Вход — Галерея & Рейтинг{% endblock %}

{% block content %}
<div class="auth-box">
    <h2>Вход в аккаунт</h2>

    {% if error %}
        <div class="alert-error">{{ error }}</div>
    {% endif %}

    <form method="post" action="/login">
        <div class="form-group">
            <label for="username">Логин или Email</label>
            <input type="text" id="username" name="username" required placeholder="Введите логин">
        </div>

        <div class="form-group">
            <label for="password">Пароль</label>
            <input type="password" id="password" name="password" required placeholder="Введите пароль">
        </div>

        <button type="submit" class="btn btn-full">Войти</button>
    </form>

    <div class="auth-footer">
        Нет аккаунта? <a href="/register">Зарегистрироваться</a>
    </div>
</div>
{% endblock %}
