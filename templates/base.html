<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Галерея & Рейтинг{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/style.css') }}">
</head>
<body>
    <header class="navbar">
        <a href="/" class="logo">Галерея & Рейтинг</a>
        <nav class="nav-links">
            {% if request.state.user %}
                <span>{{ request.state.user.username }}</span>
                <a href="/logout" class="btn btn-small">Выйти</a>
            {% else %}
                <a href="/login" class="btn btn-small">Войти</a>
                <a href="/register" class="btn btn-small btn-primary">Регистрация</a>
            {% endif %}
        </nav>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', path='/js/script.js') }}"></script>
</body>
</html>
