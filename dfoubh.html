<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Главная — Галерея &amp; Рейтинг</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d0d0f;color:#f4f4f5;font-family:system-ui,sans-serif;line-height:1.5;padding-bottom:40px}
header{background:#16161a;border-bottom:1px solid #2e2e36;padding:14px 24px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:1.2rem;font-weight:800;color:#f4f4f5;text-decoration:none}
.logo span{color:#e11d48}
.controls{display:flex;align-items:center;gap:16px;font-size:.85rem}
.nav-link{color:#9ca3af;text-decoration:none}
select,input,textarea{background:#0d0d0f;color:#f4f4f5;border:1px solid #2e2e36;padding:8px 10px;border-radius:6px;font-family:inherit;width:100%}
.controls select{width:auto}
.container{max-width:1140px;margin:0 auto;padding:24px 16px}
.hero{border-left:3px solid #e11d48;padding-left:16px;margin-bottom:28px}
.hero p{color:#9ca3af;font-size:.9rem;margin-top:4px}
.box{background:#16161a;border:1px solid #2e2e36;border-radius:8px;padding:18px;margin-bottom:28px}
.box.admin{border-style:dashed;border-color:#e11d48;display:none}
.box.admin.show{display:block}
h2{font-size:1.2rem;margin-bottom:12px}
.chart-row{display:grid;grid-template-columns:36px 2fr 3fr 75px;align-items:center;gap:12px;background:#1f1f24;padding:10px 14px;border-radius:6px;margin-bottom:8px}
.rank{font-family:monospace;font-weight:bold;color:#eab308}
.muted{color:#9ca3af;font-size:.82rem;display:block}
.bar-bg{background:#0d0d0f;height:8px;border-radius:4px;overflow:hidden}
.bar-fill{height:100%;background:#e11d48;transition:width .3s}
.score{font-family:monospace;font-weight:bold;text-align:right}
.admin-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.full-width{grid-column:1/-1}
.btn{background:#e11d48;color:#fff;border:none;padding:9px 16px;border-radius:6px;font-weight:600;cursor:pointer}
.btn:hover{background:#be123c}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px}
.card{background:#16161a;border:1px solid #2e2e36;border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
.thumb{position:relative;height:200px;background:#000}
.thumb img{width:100%;height:100%;object-fit:cover}
.badge{position:absolute;top:10px;right:10px;background:rgba(13,13,15,.9);border:1px solid #2e2e36;padding:4px 8px;border-radius:4px;font-family:monospace;font-size:.8rem}
.card-body{padding:16px;flex-grow:1;display:flex;flex-direction:column;justify-content:space-between;gap:12px}
.author{color:#9ca3af;font-size:.8rem;margin-bottom:8px}
.desc{background:#1f1f24;padding:10px;border-radius:6px;font-size:.88rem;color:#d4d4d8}
.rates{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:6px}
.rate-btn{background:#1f1f24;border:1px solid #2e2e36;color:#f4f4f5;padding:5px 0;border-radius:4px;font-family:monospace;cursor:pointer}
.rate-btn:hover{border-color:#e11d48}
.rate-btn.active{background:#e11d48;border-color:#e11d48;font-weight:bold}
.edit-admin{margin-top:10px;padding-top:10px;border-top:1px dashed #e11d48;display:flex;flex-direction:column;gap:6px}
</style>
</head>
<body>
<header>
<a href="#" class="logo">Галерея <span>&amp;</span> Рейтинг</a>
<div class="controls">
<label>Роль: <select id="roleSelect"><option value="user">Обычный зритель</option><option value="admin">Администратор</option></select></label>
<a href="#" class="nav-link">Войти</a>
</div>
</header>
<main class="container">
<section class="hero"><h1>Выставка сомнительных шедевров</h1><p>Оценивайте чужой труд так, будто сами умеете держать кисточку. Средний балл и чарт пересчитываются мгновенно.</p></section>
<section class="box"><h2>Чарт зрительских симпатий</h2><div id="chart"></div></section>
<section class="box admin" id="adminBox"><h2>Добавить новую картину</h2><form class="admin-form" id="addForm"><input type="text" id="inTitle" placeholder="Название картины" required><input type="text" id="inAuthor" placeholder="Автор" required><input type="text" id="inImg" placeholder="URL картинки (необязательно)"><textarea id="inDesc" rows="2" class="full-width" placeholder="Саркастичное описание..." required></textarea><button type="submit" class="btn">Добавить в галерею</button></form></section>
<section><h2>Экспозиция</h2><div class="grid" id="gallery"></div></section>
</main>
<script>
var role='user';
function makeImg(bg,fg,text){var c=document.createElement('canvas');c.width=600;c.height=400;var x=c.getContext('2d');x.fillStyle=bg;x.fillRect(0,0,600,400);x.fillStyle=fg;x.fillRect(180,60,240,240);x.strokeStyle='#2e2e36';x.lineWidth=3;x.strokeRect(180,60,240,240);x.fillStyle='#9ca3af';x.font='16px monospace';x.textAlign='center';x.fillText(text,300,355);return c.toDataURL()}
var items=Array.of({id:1,title:"Чёрный квадрат",author:"Казимир М.",img:makeImg('#18181b','#050505','ГЛУБИНА НЕ НАЙДЕНА'),desc:"Вы поклялись при регистрации видеть здесь глубину. Смотрите внимательнее.",ratings:Array.of(10,9,8),vote:null},{id:2,title:"Дедлайн в пятницу",author:"Сеньор",img:makeImg('#1f1216','#e11d48','PROD IS DOWN'),desc:"Экспрессивные мазки символизируют правки на продакшене в 18:59.",ratings:Array.of(9,7,8),vote:null},{id:3,title:"Кубизм в подъезде",author:"Пабло П.",img:makeImg('#1a1812','#eab308','СЛОЖНОЕ ИСКУССТВО'),desc:"Ничего не понятно, но выглядит очень дорого.",ratings:Array.of(6,5,4),vote:null});
function avg(a){return a.length?a.reduce(function(s,v){return s+v},0)/a.length:0}
function el(t,c,txt){var n=document.createElement(t);if(c)n.className=c;if(txt!==undefined)n.textContent=txt;return n}
function render(){
var ch=document.getElementById('chart');ch.innerHTML='';
Array.from(items).sort(function(a,b){return avg(b.ratings)-avg(a.ratings)}).forEach(function(x,i){
var v=avg(x.ratings),r=el('div','chart-row'),inf=el('div'),bg=el('div','bar-bg'),fl=el('div','bar-fill');
r.appendChild(el('div','rank','#'+(i+1)));inf.appendChild(el('strong','',x.title));inf.appendChild(el('span','muted',x.author+' • голосов: '+x.ratings.length));r.appendChild(inf);fl.style.width=(v*10)+'%';bg.appendChild(fl);r.appendChild(bg);r.appendChild(el('div','score',v.toFixed(2)+' ★'));ch.appendChild(r);
});
var gl=document.getElementById('gallery');gl.innerHTML='';
items.forEach(function(x){
var v=avg(x.ratings),cd=el('article','card'),th=el('div','thumb'),im=el('img'),bd=el('div','card-body'),tp=el('div'),bt=el('div'),rt=el('div','rates');
im.src=x.img;im.alt=x.title;th.appendChild(im);th.appendChild(el('div','badge',v.toFixed(2)+' / 10 ('+x.ratings.length+')'));cd.appendChild(th);
tp.appendChild(el('h3','',x.title));tp.appendChild(el('div','author','Автор: '+x.author));tp.appendChild(el('div','desc',x.desc));bd.appendChild(tp);
bt.appendChild(el('span','muted','Ваша оценка: '+(x.vote||'нет')));
for(var n=1;n<=10;n++){(function(s){var b=el('button',x.vote===s?'rate-btn active':'rate-btn',String(s));b.type='button';b.onclick=function(){if(x.vote!==null){var idx=x.ratings.lastIndexOf(x.vote);if(idx>-1)x.ratings.splice(idx,1)}x.vote=s;x.ratings.push(s);render()};rt.appendChild(b)})(n)}
bt.appendChild(rt);
if(role==='admin'){var eb=el('div','edit-admin'),ar=el('textarea'),sb=el('button','btn','Сохранить описание');ar.rows=2;ar.value=x.desc;sb.type='button';sb.onclick=function(){if(ar.value.trim()){x.desc=ar.value.trim();render()}};eb.appendChild(ar);eb.appendChild(sb);bt.appendChild(eb)}
bd.appendChild(bt);cd.appendChild(bd);gl.appendChild(cd);
});
}
document.getElementById('roleSelect').onchange=function(e){role=e.target.value;document.getElementById('adminBox').classList.toggle('show',role==='admin');render()};
document.getElementById('addForm').onsubmit=function(e){e.preventDefault();var t=document.getElementById('inTitle').value.trim(),a=document.getElementById('inAuthor').value.trim(),i=document.getElementById('inImg').value.trim()||makeImg('#16161a','#3f3f46',t.toUpperCase()),d=document.getElementById('inDesc').value.trim();items.unshift({id:Date.now(),title:t,author:a,img:i,desc:d,ratings:new Array(),vote:null});e.target.reset();render()};
render();
</script>
</body>
</html>
